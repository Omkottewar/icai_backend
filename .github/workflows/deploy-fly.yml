# ──────────────────────────────────────────────────────────────────────────────
# Deploys this backend (Node/Express + Drizzle) to Fly.io on every push to
# main. Also exposed as a manual trigger (Run workflow button in the
# Actions tab) so you can redeploy without pushing — handy for env-var
# rotations and config-only changes.
#
# ──────────────────────────────────────────────────────────────────────────────
# ONE-TIME SETUP (do these BEFORE the first run, otherwise the deploy step
# will fail with "no FLY_API_TOKEN"):
#
#   1. From a laptop with flyctl installed and logged in:
#         flyctl tokens create deploy -x 999999h --app icai
#      Copy the printed token (one long line, starts with "FlyV1 ...").
#
#   2. In GitHub → this repo → Settings → Secrets and variables → Actions
#      → New repository secret:
#         Name:   FLY_API_TOKEN
#         Secret: <paste the token>
#
# ──────────────────────────────────────────────────────────────────────────────
# DATABASE MIGRATIONS ARE NOT RUN BY THIS WORKFLOW.
#
# When a PR introduces a new migration under drizzle/, apply it BEFORE
# merging the PR by running (from a laptop pointed at the prod DB):
#
#   DATABASE_URL="<prod url>" npm run db:migrate
#
# Automatic migrations on container start can wedge the Fly app
# indefinitely if a migration fails. Keeping them manual means a bad
# migration is contained to the human who ran it.
#
# ──────────────────────────────────────────────────────────────────────────────

name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you redeploying manually?'
        required: false
        default: 'manual redeploy'

# Only one deploy at a time. If a second push lands while this run is
# in-flight, the second one queues (cancel-in-progress: false) so we
# don't interrupt a half-rolled machine upgrade.
concurrency:
  group: deploy-fly
  cancel-in-progress: false

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile's NODE_VERSION so CI exercises the same
          # Node runtime the production container will use.
          node-version: '22.17.0'
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Typecheck (tsc --noEmit)
        # The repo has one pre-existing error in db/client.ts
        # (statement_timeout string-vs-number). Filter it out so it doesn't
        # block deploys; ANY new error still fails the job. Remove this
        # filter once db/client.ts is fixed.
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee tsc.log || true
          if grep -v 'db/client.ts' tsc.log | grep -E ': error TS' ; then
            echo "::error::New TypeScript errors introduced — fix them before deploy."
            exit 1
          fi

  deploy:
    name: Deploy to Fly.io
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Guard — forks' PRs don't have access to secrets anyway, but this
    # makes the intent explicit.
    if: github.event.pull_request == null
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Log manual-trigger reason (if any)
        if: github.event_name == 'workflow_dispatch'
        run: echo "::notice::Manual deploy — ${{ github.event.inputs.reason }}"

      - name: Deploy
        # --remote-only builds the image on Fly's own builder (faster
        # layer cache than buildx-on-GHA for this app, and avoids
        # shipping the whole repo as a build context to a GitHub runner).
        run: flyctl deploy --remote-only --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Post-deploy health check
        # Hits /api/health right after Fly reports the release healthy.
        # Catches the rare case where Fly's own health check is cached
        # and the new machine is actually crashing on first requests.
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS https://icai.fly.dev/api/health > /dev/null; then
              echo "::notice::Health check passed on attempt $i"
              exit 0
            fi
            echo "Health check attempt $i failed, retrying in 5s…"
            sleep 5
          done
          echo "::error::Backend did not report healthy within 25 seconds of deploy"
          exit 1
